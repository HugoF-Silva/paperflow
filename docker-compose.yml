services:
  matcher:
    build: .
    entrypoint:
      - python
      - -m
      - harness.cli
      - --input-dir
      - /app/papers
    volumes:
      - type: bind
        source: ./papers
        target: /app/papers
        read_only: true
      - ./results:/work/results
      - ./.paperflow.local.toml:/app/.paperflow.local.toml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MAX_PARALLEL: ${MAX_PARALLEL:-1}
      MAX_RALPH: ${MAX_RALPH:-8}
