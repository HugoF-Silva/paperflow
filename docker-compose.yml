services:
  matcher:
    build: .
    volumes:
      - ./papers:/work/papers:ro
      - ./results:/work/results
      # Optional: mount a local config so the orchestrator can read it.
      # `touch .paperflow.local.toml` ahead of time so Docker doesn't create
      # a directory in its place.
      - ./.paperflow.local.toml:/app/.paperflow.local.toml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    command:
      - run
      - --input-dir
      - /work/papers
      - --output-dir
      - /work/results
      - --soon-days
      - "31"
      - --countries
      - BR
