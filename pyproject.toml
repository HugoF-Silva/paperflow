[project]
name = "batch-venue-matcher"
version = "0.1.0"
description = "Batch-process academic papers and find the publication venues each truly belongs to, by driving the venue-matcher skill via the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hugo Fernandes" }]
dependencies = [
    "claude-agent-sdk>=0.2.87",
    "python-docx>=1.1.0",
    "psutil>=5.9.0",
]

[project.scripts]
batch-venue-matcher = "batch_venue_matcher.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["batch_venue_matcher*"]
namespaces = true
